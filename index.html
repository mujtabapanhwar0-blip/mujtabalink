<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghulam Mujtaba Panhwar Portfolio</title>
    <style>
        /* Base Styling */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

               /* 1. Main Container Spacing Fixed for Desktop */
        .main-container {
            background: #000000 !important;
            background-color: #000000 !important;
            border: 2px solid #00f2fe;
            border-radius: 16px;
            padding: 15px 20px; /* Padding kam ki taake buttons upar aayein */
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), 0 0 50px rgba(255, 0, 127, 0.3);
            text-align: center;
        }

        /* Profile Header Spacing Fixed */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px; /* Margin kam ki */
        }

        /* Profile Box */
        .my-profile-box {
            width: 90px; /* Size thoda chota kiya */
            height: 90px;
            background: #000000 !important;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px #00f2fe, 0 0 35px #ff007f;
            animation: profileFastGlow 1.2s infinite alternate;
            margin-bottom: 10px;
        }

        /* Profile Box Black with Fast Neon Glow */
        .my-profile-box {
            width: 120px;
            height: 120px;
            background: #000000 !important;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px #00f2fe, 0 0 35px #ff007f;
            animation: profileFastGlow 1.2s infinite alternate;
            margin-bottom: 15px;
        }

        @keyframes profileFastGlow {
            0% { box-shadow: 0 0 10px #00f2fe, 0 0 20px #ff007f; transform: scale(1); }
            100% { box-shadow: 0 0 25px #ff007f, 0 0 45px #00f2fe; transform: scale(1.03); }
        }

        .my-profile-box svg {
            width: 60px;
            height: 60px;
            fill: #ffffff;
        }

        .name-title {
            font-size: 32px;
            font-weight: bold;
            margin: 5px 0;
            letter-spacing: 1px;
        }

        .welcome-text {
            font-size: 20px;
            color: #ff8c00;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        /* Ya Ali Madad Heavy Box Frame */
        .ya-ali-box {
            position: relative;
            max-width: 400px;
            height: 80px;
            margin: 0 auto 40px auto;
            overflow: hidden;
            border-radius: 10px;
            padding: 4px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ya-ali-box span {
            position: absolute;
            display: block;
        }
        .ya-ali-box span:nth-child(1) {
            top: 0; left: -100%; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #00f2fe, #ff007f);
            animation: fastLineTop 1.2s linear infinite;
        }
        @keyframes fastLineTop { 0% { left: -100%; } 50%, 100% { left: 100%; } }
        
        .ya-ali-box span:nth-child(2) {
            top: -100%; right: 0; width: 4px; height: 100%;
            background: linear-gradient(180deg, transparent, #00f2fe, #ff007f);
            animation: fastLineRight 1.2s linear infinite;
            animation-delay: 0.3s;
        }
        @keyframes fastLineRight { 0% { top: -100%; } 50%, 100% { top: 100%; } }

        .ya-ali-box span:nth-child(3) {
            bottom: 0; right: -100%; width: 100%; height: 4px;
            background: linear-gradient(270deg, transparent, #00f2fe, #ff007f);
            animation: fastLineBottom 1.2s linear infinite;
            animation-delay: 0.6s;
        }
        @keyframes fastLineBottom { 0% { right: -100%; } 50%, 100% { right: 100%; } }

        .ya-ali-box span:nth-child(4) {
            bottom: -100%; left: 0; width: 4px; height: 100%;
            background: linear-gradient(360deg, transparent, #00f2fe, #ff007f);
            animation: fastLineLeft 1.2s linear infinite;
            animation-delay: 0.9s;
        }
        @keyframes fastLineLeft { 0% { bottom: -100%; } 50%, 100% { bottom: 100%; } }

        .ya-ali-inner {
            width: 100%;
            height: 100%;
            background: #000000 !important;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .ya-ali-inner h2 {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', sans-serif;
            font-size: 26px;
            font-weight: 900 !important;
            color: #ffffff !important;
            margin: 0;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #00f2fe, 0 0 30px #ff007f;
        }

        /* 2. BUTTONS KO SEEDHI HORIZONTAL LINE MEIN LANE KI SETTING */
        .buttons-horizontal-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px; /* Buttons ke darmiyan ka gap */
            margin-top: 20px;
        }

        .glow-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white !important;
            text-decoration: none !important;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s ease;
            min-width: 140px;
        }

        .glow-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
            margin-right: 8px;
        }

        /* Temu Fast Orange Glow */
        .temu-glow {
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            animation: tGlow 1.5s infinite alternate;
        }
        @keyframes tGlow {
            0% { box-shadow: 0 0 5px rgba(255,69,0,0.5); transform: scale(1); }
            100% { box-shadow: 0 0 20px rgba(255,69,0,1); transform: scale(1.03); }
        }

        /* YouTube Red Glow */
        .youtube-glow {
            background: linear-gradient(135deg, #e52d27, #b31217);
            animation: ytGlow 1.5s infinite alternate 0.2s;
        }
        @keyframes ytGlow {
            0% { box-shadow: 0 0 5px rgba(229,45,39,0.5); transform: scale(1); }
            100% { box-shadow: 0 0 20px rgba(229,45,39,1); transform: scale(1.03); }
        }

        /* TikTok Cyber Glow */
        .tiktok-glow {
            background: linear-gradient(135deg, #010101, #ee1d52);
            animation: tkGlow 1.5s infinite alternate 0.4s;
        }
        @keyframes tkGlow {
            0% { box-shadow: 0 0 5px rgba(238,29,82,0.5); transform: scale(1); }
            100% { box-shadow: 0 0 20px rgba(238,29,82,1); transform: scale(1.03); }
        }

        /* Instagram Pink Glow */
        .instagram-glow {
            background: linear-gradient(135deg, #8a3ab9, #e95950);
            animation: inGlow 1.5s infinite alternate 0.6s;
        }
        @keyframes inGlow {
            0% { box-shadow: 0 0 5px rgba(233,89,80,0.5); transform: scale(1); }
            100% { box-shadow: 0 0 20px rgba(233,89,80,1); transform: scale(1.03); }
        }

        /* Twitter Neon Blue Glow */
        .twitter-glow {
            background: linear-gradient(135deg, #1fa2ff, #12d6df);
            animation: twGlow 1.5s infinite alternate 0.8s;
        }
        @keyframes twGlow {
            0% { box-shadow: 0 0 5px rgba(31,162,255,0.5); transform: scale(1); }
            100% { box-shadow: 0 0 20px rgba(31,162,255,1); transform: scale(1.03); }
        }

        /* Pinterest Red Glow */
        .pinterest-glow {
            background: linear-gradient(135deg, #bd081c, #e60023);
            animation: ptGlow 1.5s infinite alternate 1s;
        }
        @keyframes ptGlow {
            0% { box-shadow: 0 0 5px rgba(230,0,35,0.5); transform: scale(1); }
            100% { box-shadow: 0 0 20px rgba(230,0,35,1); transform: scale(1.03); }
        }

        /* Special Offers Pink Glow */
        .offers-glow {
            background: linear-gradient(135deg, #f857a6, #ff5858);
            animation: ofGlow 1.5s infinite alternate 1.2s;
        }
        @keyframes ofGlow {
            0% { box-shadow: 0 0 5px rgba(248,87,166,0.5); transform: scale(1); }
            100% { box-shadow: 0 0 20px rgba(248,87,166,1); transform: scale(1.03); }
        }
    </style>
</head>
